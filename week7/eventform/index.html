<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Ticket</title>
  <link rel="stylesheet" href="event.css" />
  <script src="event.js" defer></script>
</head>
<body>
  <main class="wrapper">
    <h1>Event Ticket</h1>

    <form id="eventForm" novalidate>
      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" name="firstName" type="text" autocomplete="given-name" required />
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" name="lastName" type="text" autocomplete="family-name" required />
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type" required>
          <option value="">Choose one</option>
          <option value="student">Student</option>
          <option value="guest">Guest</option>
        </select>
      </div>

      <div class="field">
        <label for="eventDate">Event Date</label>
        <input id="eventDate" name="eventDate" type="date" required />
      </div>

      <div id="studentField" class="field full" hidden>
        <label for="studentId">Student #</label>
        <input id="studentId" name="studentId" type="text" inputmode="numeric" autocomplete="off" />
      </div>

      <div id="guestField" class="field full" hidden>
        <label for="accessCode">Access Code</label>
        <input id="accessCode" name="accessCode" type="text" autocomplete="off" />
      </div>

      <button class="full" type="submit">Create Ticket</button>
    </form>

    <p id="message" class="message" role="alert" hidden></p>
    <section id="ticket" class="ticket" aria-live="polite" hidden>
      <h2>Ticket Created</h2>
      <p class="ticket-name"></p>
      <p class="ticket-type"></p>
      <p class="ticket-date"></p>
    </section>
  </main>
</body>
</html>
