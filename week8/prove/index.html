<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet Typhlosion, the Fire-type Pokémon.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Typhlosion Character Card">
  <meta property="og:description" content="Meet Typhlosion, the Fire-type Pokémon.">
  <meta property="og:url" content="https://zyragoon.github.io/WDD131/week8/prove/">
  <meta property="og:image" content="https://zyragoon.github.io/WDD131/week8/prove/images/Typhlosion.jpg">
  <meta property="og:image:alt" content="Typhlosion Pokémon card artwork by GIDORA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Typhlosion Character Card">
  <meta name="twitter:description" content="Meet Typhlosion, the Fire-type Pokémon.">
  <meta name="twitter:image" content="https://zyragoon.github.io/WDD131/week8/prove/images/Typhlosion.jpg">
  <meta name="twitter:image:alt" content="Typhlosion Pokémon card artwork by GIDORA">
  <title>Character Card</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <article class="character-card" aria-labelledby="character-name">
      <img class="character-image" id="character-image" alt="Picture of Typhlosion, from the TCG, art by GIDORA" src="images/Typhlosion.jpg">
      <h1 id="character-name"></h1>
      <div class="character-details" aria-live="polite">
        <p><strong>Class:</strong> <span id="character-class"></span></p>
        <p><strong>Level:</strong> <span id="character-level"></span></p>
        <p><strong>Health:</strong> <span id="character-health"></span></p>
        <p class="character-status" id="character-status" role="status"></p>
      </div>
      <div class="card-actions">
        <button id="attack-button" type="button">Attacked</button>
        <button id="level-up-button" type="button">Level Up</button>
      </div>
    </article>
  </main>
</body>
</html>
